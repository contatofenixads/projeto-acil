<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c10">
  <meta name="description" content="Marketing digital de bolso para lojistas: ideias, textos, legendas e roteiros prontos.">
  <title>Marketing de Bolso</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0c10;--panel:#14171f;--panel-2:#191d27;--border:#29303d;--muted:#8992a4;--text:#eef1f7;--yellow:#ffbd38;--yellow-2:#f2a900;--blue:#8aafff;--sidebar:250px}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit}.app{min-height:100vh}.sidebar{width:var(--sidebar);position:fixed;inset:0 auto 0 0;background:#141821;border-right:1px solid var(--border);padding:18px 12px 22px;display:flex;flex-direction:column;z-index:5;overflow:auto}.brand{font-size:17px;font-weight:800;letter-spacing:-.45px;padding:3px 10px 16px;white-space:nowrap}.brand span{color:var(--yellow)}.nav-label{padding:14px 12px 8px;color:#697385;text-transform:uppercase;font-size:10px;letter-spacing:1px}.nav{display:grid;gap:3px}.nav-button{display:flex;align-items:center;gap:9px;width:100%;border:1px solid transparent;border-radius:11px;background:none;color:#9aa4b6;text-align:left;padding:10px 12px;transition:.15s}.nav-button:hover{background:#1b202b;color:#f5f6fa}.nav-button.active{border-color:var(--yellow);background:#1c2029;color:#fff;box-shadow:0 0 0 1px #ffbd3812}.nav-button.active .nav-icon{filter:saturate(1.2)}.nav-icon{width:16px;text-align:center;font-size:14px}.nav-bottom{margin-top:auto;border-top:1px solid var(--border);padding-top:12px}.sidebar-footer{color:#626c7c;font-size:11px;padding:14px 12px 0}.shell{margin-left:var(--sidebar);min-height:100vh}.topbar{height:73px;position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#0b0c10ee;border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}.top-left{display:flex;align-items:center;gap:14px;min-width:0}.page-title{font-weight:750;font-size:17px;white-space:nowrap}.top-actions{display:flex;align-items:center;gap:12px}.store-select{width:200px;max-width:34vw}.main{max-width:1120px;margin:0 auto;padding:24px}.mobile-menu{display:none}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border);border-radius:11px;background:#1b202b;color:#e7ebf3;padding:10px 14px;font-weight:650;transition:.15s}.btn:hover{background:#232a37;border-color:#414b5c}.btn-primary{background:var(--yellow);border-color:var(--yellow);color:#17130a}.btn-primary:hover{background:#ffcb57;border-color:#ffcb57}.btn-small{padding:8px 12px;font-size:13px}.btn-quiet{background:transparent}.btn:disabled{opacity:.6;cursor:not-allowed}.field-control{width:100%;border:1px solid var(--border);border-radius:11px;background:#11141b;color:var(--text);padding:12px 13px;outline:none}.field-control:focus{border-color:#d69c23;box-shadow:0 0 0 3px #ffbd381c}.field-control::placeholder{color:#687284}.select-control{appearance:auto}.card{background:var(--panel);border:1px solid var(--border);border-radius:15px}.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}.stat{padding:15px 16px}.stat-number{font-size:22px;font-weight:750;margin-bottom:1px}.stat-label{font-size:12px;color:var(--blue)}.notice{padding:20px 22px;margin-bottom:18px}.notice strong{display:block;margin-bottom:4px}.notice p{margin:0;color:var(--blue);font-size:13px}.section-card{padding:23px 22px 25px;margin-bottom:18px}.section-card h1,.section-card h2{font-size:20px;line-height:1.3;margin:0 0 7px;letter-spacing:-.25px}.section-card p{margin:0;color:var(--muted);font-size:13px}.search-wrap{max-width:520px;margin-top:15px;position:relative}.search-wrap .field-control{padding-left:40px}.search-icon{position:absolute;left:14px;top:11px;color:#7b8494}.category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.category-card{padding:20px 18px;min-height:154px;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}.category-card:hover,.solution-card:hover{transform:translateY(-2px);border-color:#495366;background:#181c25}.category-emoji{font-size:20px;margin-bottom:10px}.category-card h3{font-size:15px;margin:0 0 6px}.category-card p{margin:0 0 8px;color:var(--muted);font-size:13px}.category-count{color:var(--yellow);font-size:12px}.crumb{display:inline-block;color:var(--muted);text-decoration:none;margin:3px 0 20px;font-size:12px}.crumb:hover{color:var(--yellow)}.category-description{color:var(--muted);font-size:13px;margin:-5px 0 16px}.solution-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.solution-card{padding:18px;min-height:172px;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}.solution-card .category-emoji{margin-bottom:8px}.solution-card h3{font-size:14px;line-height:1.4;margin:0 0 7px}.solution-category{color:var(--muted);font-size:12px;margin-bottom:6px}.solution-pain{color:#f0c35c;font-size:12px;line-height:1.5}.form-card{padding:21px 22px 22px;max-width:850px}.form-card h1{font-size:20px;margin:0 0 3px}.quote{color:#f0c35c;font-size:12px;margin-bottom:2px}.form-note{color:var(--muted);font-size:12px;margin:7px 0 19px}.field{margin:0 0 15px}.field label{display:block;color:#a1a9b8;font-size:12px;margin-bottom:7px}.field label .required{color:var(--yellow)}.field textarea{min-height:90px;resize:vertical}.field-help{color:#717b8b;font-size:11px;margin-top:6px}.file-box{background:#11141b;border:1px solid var(--border);border-radius:11px;padding:14px;text-align:center}.file-box input{max-width:100%;color:#b6bdc9}.file-box small{display:block;color:var(--muted);font-size:11px;margin-top:6px}.form-actions{display:flex;gap:9px;margin-top:20px}.result-card{padding:20px 22px;margin-top:18px;max-width:850px}.result-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.result-header h2{font-size:16px;margin:0}.result-content{white-space:pre-wrap;color:#e7ebf3;background:#10131a;border:1px solid var(--border);padding:16px;border-radius:11px;line-height:1.7}.result-actions{display:flex;gap:9px;margin-top:12px}.empty{padding:22px;text-align:center;color:var(--muted)}.history-list{display:grid;gap:10px}.history-item{padding:17px;display:flex;align-items:center;justify-content:space-between;gap:16px}.history-item h3{font-size:14px;margin:0 0 3px}.history-item p{font-size:12px;color:var(--muted);margin:0}.overlay{position:fixed;inset:0;background:#0009;z-index:10;display:grid;place-items:center;padding:18px}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid #3a4150;border-radius:17px;padding:23px;box-shadow:0 25px 80px #0009}.modal-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:4px}.modal-header h2{margin:0;font-size:20px}.modal-subtitle{color:var(--muted);font-size:13px;margin:0 0 19px}.close-btn{width:34px;height:34px;padding:0;border-radius:9px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.span-two{grid-column:1/-1}.toast{position:fixed;bottom:20px;right:22px;z-index:20;background:#202631;border:1px solid #485363;border-radius:12px;padding:12px 16px;box-shadow:0 8px 28px #0008;color:#f5f6f8;animation:appear .18s ease}.backdrop{display:none}.motion-icon{--icon-accent:#ffbd38;position:relative;display:inline-grid;place-items:center;flex:0 0 34px;width:34px;height:34px;border:1px solid color-mix(in srgb,var(--icon-accent),transparent 78%);border-radius:11px;background:color-mix(in srgb,var(--icon-accent),transparent 91%);animation:logo-float 3.8s ease-in-out infinite,logo-pulse 2.1s ease-in-out infinite;transition:transform .2s,box-shadow .2s}.motion-icon img{display:block;width:22px;height:22px;object-fit:contain}.motion-icon svg{width:20px;height:20px}.motion-icon-instagram{--icon-accent:#ff0069;--icon-secondary:#833ab4;background:linear-gradient(145deg,#833ab4,#fd1d1d 58%,#fcb045);border-color:#ffffff30}.motion-icon-tiktok{--icon-accent:#25f4ee;--icon-secondary:#fe2c55;background:#101115;border-color:#25f4ee55}.motion-icon-tiktok img{filter:drop-shadow(2px 1px 0 #fe2c55) drop-shadow(-1px -1px 0 #25f4ee)}.motion-icon-whatsapp{--icon-accent:#25d366}.motion-icon-meta{--icon-accent:#0866ff;background:transparent;border:0}.motion-icon-meta img{width:26px;height:26px}.motion-icon-canva{--icon-accent:#00c4cc;--icon-secondary:#6420ff;width:34px;flex-basis:34px;background:transparent;border:0;border-radius:999px}.motion-icon-canva img{width:30px;height:30px}.motion-icon-capcut{--icon-accent:#f1f1f1;--icon-secondary:#8992a4;background:#111a20;border-color:#ffffff26}.motion-icon-capcut img{filter:brightness(0) invert(1)}.motion-icon-imagens{--icon-accent:#f6c344}.motion-icon-dia-a-dia{--icon-accent:#ffbd38}.nav-icon{display:flex;align-items:center;justify-content:center;flex:0 0 24px;width:24px}.nav-icon .motion-icon{flex-basis:22px;width:22px;height:22px;border-radius:7px;animation-duration:4.4s,2.1s}.nav-icon .motion-icon img{width:15px;height:15px}.nav-icon .motion-icon-meta img{width:20px;height:20px}.nav-icon .motion-icon-canva{flex-basis:22px;width:22px;height:22px}.nav-icon .motion-icon-canva img{width:20px;height:20px}.nav-icon .motion-icon-capcut img{width:14px;height:14px}.category-emoji .motion-icon{margin-bottom:0}.category-card:hover .motion-icon,.solution-card:hover .motion-icon,.nav-button:hover .motion-icon{filter:brightness(1.14)}.page-title-brand{display:inline-flex;align-items:center;gap:9px}.page-title-brand .motion-icon{width:28px;height:28px;flex-basis:28px;border-radius:8px;animation-duration:4.6s}.page-title-brand .motion-icon img{width:18px;height:18px}.page-title-brand .motion-icon-meta img{width:22px;height:22px}.page-title-brand .motion-icon-canva{width:28px;height:28px;flex-basis:28px}.page-title-brand .motion-icon-canva img{width:24px;height:24px}@keyframes logo-float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2px) rotate(1.5deg)}}@keyframes logo-pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--icon-accent),transparent 88%)}50%{box-shadow:0 0 12px 2px color-mix(in srgb,var(--icon-accent),transparent 42%),0 0 20px 5px color-mix(in srgb,var(--icon-secondary,var(--icon-accent)),transparent 68%)}}@media(prefers-reduced-motion:reduce){.motion-icon,.category-card,.solution-card{animation:none;transition:none}}
    @keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:760px){:root{--sidebar:250px}.sidebar{transform:translateX(-100%);transition:transform .2s}.sidebar.open{transform:translateX(0)}.backdrop.show{display:block;position:fixed;inset:0;background:#0008;z-index:4}.shell{margin-left:0}.mobile-menu{display:inline-flex;width:36px;height:36px;padding:0;border:0;background:transparent;color:#eff1f5;font-size:20px}.topbar{height:65px;padding:0 14px}.page-title{font-size:15px}.main{padding:17px 14px 28px}.top-actions{gap:7px}.store-select{width:140px}.top-actions .btn{padding:8px 10px}.stat-grid{gap:8px}.stat{padding:12px 11px}.stat-number{font-size:19px}.stat-label{font-size:11px}.notice,.section-card{padding:17px}.category-card{padding:16px;min-height:150px}.solution-grid{gap:9px}.solution-card{padding:14px;min-height:170px}.form-card{padding:18px}.history-item{align-items:flex-start}.result-header{align-items:flex-start;flex-direction:column}}
    @media(max-width:420px){.top-actions .store-select{width:112px;font-size:12px}.top-actions .btn{font-size:12px;padding:8px}.category-grid,.solution-grid{grid-template-columns:1fr}.category-card{min-height:0}.stat-label{max-width:84px}.form-grid{grid-template-columns:1fr}.span-two{grid-column:auto}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const categories = [
      {id:'imagens',name:'Imagens',icon:'🖼️',description:'Prompts de imagem, fotos de produto e visual da loja',solutions:[['Foto profissional de produto','Minha foto de produto está feia ou amadora'],['Ambiente e foto da loja','Quero mostrar a loja de um jeito bonito no Instagram e no Google'],['Capas de destaques do Instagram','Meus destaques estão sem capa ou sem padrão'],['Banner e capa de site ou link','Preciso de um banner para anúncio, link na bio ou site'],['Produto em modelo gerado por IA','Quero mostrar a roupa ou o produto em alguém sem fazer ensaio']]},
      {id:'atendimento',name:'Atendimento',icon:'💬',description:'Mensagens de WhatsApp para abordar, atender, recuperar e vender',solutions:[['Primeira abordagem ao cliente','Não sei como começar a conversa com quem chama'],['Fluxo completo de atendimento','Perco vendas porque respondo sem método'],['Recuperar cliente que sumiu','Cliente pediu orçamento e não respondeu mais'],['Mensagem de promoção','Quero avisar a promoção para a base sem parecer spam'],['Anúncio de lançamento','Tenho um produto novo e não sei como divulgar'],['Novidades e chegadas','Chegou produto novo e quero avisar quem já é cliente']]},
      {id:'instagram',name:'Instagram',icon:'📸',description:'Bio, legendas, hashtags, dicas e alcance',solutions:[['Bio que vende','Meu perfil não diz o que eu faço nem o que o cliente ganha'],['Legendas prontas para post','Não sei o que escrever na legenda'],['Hashtags certas para o nicho','Uso hashtag genérica e não aparece para ninguém'],['Ideias de post para alcance','Meu alcance caiu e quero ideias que circulem'],['Dicas rápidas de Instagram','Quero melhorar o perfil sem gastar tempo']]},
      {id:'tiktok',name:'TikTok',icon:'🎵',description:'Roteiros, ganchos e legendas para vídeo curto',solutions:[['Roteiro de vídeo curto','Não sei o que falar no vídeo e fico travado'],['Ganchos para os primeiros 3 segundos','As pessoas passam direto pelo meu vídeo'],['Legenda e hashtags para TikTok','Não sei escrever a legenda que puxa visualização'],['Ideias de vídeo para a semana','Não tenho ideia para postar toda semana']]},
      {id:'anuncios',name:'Anúncios',icon:'📣',description:'Tráfego pago: textos, públicos e diagnóstico de campanha',solutions:[['Textos de anúncio (Meta Ads)','Meu anúncio tem pouco clique'],['Público e segmentação','Não sei para quem anunciar'],['Diagnóstico da campanha','Gastei e não sei o que está dando errado'],['Organização da campanha','Minha conta de anúncio está bagunçada']]},
      {id:'canva',name:'Canva',icon:'🎨',description:'Passo a passo para criar artes no Canva',solutions:[['Arte de post no Canva','Não sei montar a arte no Canva e fica feio'],['Paleta e identidade da marca','Minhas artes não têm cara de marca'],['Textos curtos para arte','Não sei o que escrever dentro da arte']]},
      {id:'capcut',name:'CapCut',icon:'🎬',description:'Edição de vídeo: cortes, legendas, transições e ritmo',solutions:[['Roteiro de edição passo a passo','Gravei o vídeo e não sei como editar no CapCut'],['Legendas e textos na tela','Preciso colocar legenda e texto no vídeo'],['Ritmo e gancho do vídeo','Meu vídeo fica arrastado e as pessoas saem']]},
      {id:'dia-a-dia',name:'Dia a dia da loja',icon:'🏪',description:'Avisos, vitrine, mensagens rápidas e dicas gerais',solutions:[['Aviso de horário e funcionamento','Preciso avisar meus clientes sobre o horário'],['Vitrine que chama atenção','Quero deixar a vitrine mais atrativa'],['Mensagem rápida para clientes','Quero mandar uma mensagem útil para meus clientes'],['Ideias para movimentar a loja','O movimento caiu e preciso de ideias']]}
    ];
    const state={page:'home',category:null,solution:null,storeModal:false,stores:read('mb-stores',[]),selectedStore:read('mb-selected-store',''),history:read('mb-history',[]),search:'',result:null,mobileOpen:false};
    function read(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
    function persist(){localStorage.setItem('mb-stores',JSON.stringify(state.stores));localStorage.setItem('mb-selected-store',JSON.stringify(state.selectedStore));localStorage.setItem('mb-history',JSON.stringify(state.history))}
    function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function selectedStore(){return state.stores.find(store=>store.id===state.selectedStore)}
    function currentCategory(){return categories.find(category=>category.id===state.category)}
    function iconMarkup(id){const assets={instagram:'instagram-white.svg',tiktok:'tiktok.svg',atendimento:'whatsapp.svg',anuncios:'meta.svg',canva:'canva.svg',capcut:'capcut.svg'};const custom={imagens:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="12" cy="12" r="4"/><path d="m7 4 1-2h8l1 2"/><path d="m17 8 .01 0"/></svg>', 'dia-a-dia':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9M9 20v-7h6v7"/><path d="M3 21h18"/></svg>',home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9M9 21v-7h6v7"/></svg>',history:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',store:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18l-2-6H5l-2 6Z"/><path d="M5 10v10h14V10M9 20v-6h6v6"/><path d="M3 10a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/></svg>'};if(assets[id])return `<span class="motion-icon motion-icon-${id}" aria-hidden="true"><img src="assets/icons/${assets[id]}" alt=""></span>`;return `<span class="motion-icon motion-icon-${id}" aria-hidden="true">${custom[id]||''}</span>`}
    function title(){if(state.page==='home')return 'Início';if(state.page==='category'){const category=currentCategory();return `<span class="page-title-brand">${iconMarkup(category.id)}${category.name}</span>`}if(state.page==='form'){const category=currentCategory();return `<span class="page-title-brand">${iconMarkup(category.id)}${state.solution?.[0]||''}</span>`}return 'Histórico'}
    function navButton(label,icon,id,active){return `<button class="nav-button ${active?'active':''}" data-nav="${id}"><span class="nav-icon">${icon}</span>${label}</button>`}
    function render(){
      const app=document.getElementById('app');
      app.innerHTML=`<div class="backdrop ${state.mobileOpen?'show':''}" data-action="close-mobile"></div><aside class="sidebar ${state.mobileOpen?'open':''}"><div class="brand">Marketing <span>de Bolso</span></div><nav class="nav">${navButton('Início',iconMarkup('home'),'home',state.page==='home')}
        <div class="nav-label">Menus</div>${categories.map(category=>navButton(category.name,iconMarkup(category.id),category.id,state.category===category.id)).join('')}
        <div class="nav-label">Lojas</div>${navButton('＋ Nova loja',iconMarkup('store'),'new-store',false)}
        </nav><div class="nav-bottom">${navButton('Histórico',iconMarkup('history'),'history',state.page==='history')}<div class="sidebar-footer">Feito para facilitar o dia a dia da sua loja</div></div></aside>
        <div class="shell"><header class="topbar"><div class="top-left"><button class="mobile-menu" data-action="mobile" aria-label="Abrir menu">☰</button><div class="page-title">${title()}</div></div><div class="top-actions"><select class="field-control select-control store-select" id="store-select" aria-label="Selecionar loja"><option value="">${state.stores.length?'Selecione uma loja':'Sem loja cadastrada'}</option>${state.stores.map(store=>`<option value="${esc(store.id)}" ${state.selectedStore===store.id?'selected':''}>${esc(store.name)}</option>`).join('')}</select><button class="btn btn-primary btn-small" data-action="new-store">＋ Loja</button></div></header><main class="main">${renderPage()}</main></div>${state.storeModal?renderStoreModal():''}`;
      bind();
    }
    function renderPage(){if(state.page==='home')return renderHome();if(state.page==='category')return renderCategory();if(state.page==='form')return renderForm();return renderHistory()}
    function renderHome(){
      const query=state.search.trim().toLocaleLowerCase('pt-BR');
      const matched=categories.flatMap(category=>category.solutions.map(solution=>({category,solution}))).filter(item=>!query||`${item.category.name} ${item.solution[0]} ${item.solution[1]}`.toLocaleLowerCase('pt-BR').includes(query));
      return `<div class="stat-grid"><div class="card stat"><div class="stat-number">8</div><div class="stat-label">menus</div></div><div class="card stat"><div class="stat-number">34</div><div class="stat-label">soluções prontas</div></div><div class="card stat"><div class="stat-number">${state.stores.length}</div><div class="stat-label">lojas cadastradas</div></div></div>
        ${!selectedStore()?`<section class="card notice"><strong>Banco não configurado.</strong><p>Você ainda pode gerar conteúdos, mas as lojas e o histórico só funcionam depois de configurar o Supabase.</p></section>`:''}
        <section class="card section-card"><h1>Qual é o seu problema hoje?</h1><p>Escolha um menu ou busque pela dor. Cada solução pede só o essencial e entrega pronto para usar.</p><div class="search-wrap"><span class="search-icon">⌕</span><input id="search" class="field-control" type="search" placeholder="Ex.: bio, cliente sumiu, foto do produto, hashtag..." value="${esc(state.search)}"></div></section>
        ${query?`<div class="solution-grid">${matched.length?matched.map(item=>solutionCard(item.category,item.solution)).join(''):'<div class="card empty">Nenhuma solução encontrada. Tente outra busca.</div>'}</div>`:`<section class="category-grid">${categories.map(category=>`<article class="card category-card" data-category="${category.id}"><div class="category-emoji">${iconMarkup(category.id)}</div><h3>${category.name}</h3><p>${category.description}</p><div class="category-count">${category.solutions.length} soluções</div></article>`).join('')}</section>`}`
    }
    function solutionCard(category,solution){return `<article class="card solution-card" data-solution-category="${category.id}" data-solution-title="${esc(solution[0])}"><div class="category-emoji">${iconMarkup(category.id)}</div><h3>${esc(solution[0])}</h3><div class="solution-category">${category.name}</div><div class="solution-pain">“${esc(solution[1])}”</div></article>`}
    function renderCategory(){const category=currentCategory();if(!category)return renderHome();return `<a href="#" class="crumb" data-nav="home">← Início</a><div class="category-description">${category.description}</div><section class="solution-grid">${category.solutions.map(solution=>solutionCard(category,solution)).join('')}</section>`}
    function field(label,name,placeholder='',type='text',required=false,help=''){return `<div class="field"><label for="${name}">${label}${required?' <span class="required">*</span>':''}</label>${type==='textarea'?`<textarea class="field-control" id="${name}" name="${name}" placeholder="${esc(placeholder)}" ${required?'required':''}></textarea>`:`<input class="field-control" id="${name}" name="${name}" type="${type}" placeholder="${esc(placeholder)}" ${required?'required':''}>`}${help?`<div class="field-help">${help}</div>`:''}</div>`}
    function renderForm(){const category=currentCategory();const store=selectedStore();if(!category||!state.solution)return renderHome();let fields='';
      if(category.id==='imagens')fields=`${field('Produto ou serviço','subject','Ex.: Vestido midi floral','text',true)}<div class="field"><label for="style">Estilo da foto</label><select class="field-control select-control" id="style"><option>Fundo branco (catálogo)</option><option>Estilo editorial</option><option>Ambiente natural</option><option>Imagem para redes sociais</option></select></div>${field('Detalhes extras (opcional)','details','Público, diferenciais, cores ou o que já tentou...','textarea')}`;
      else if(category.id==='atendimento')fields=`${field('Situação ou objetivo','subject','Ex.: cliente perguntou o preço de uma bolsa','text',true)}<div class="field"><label for="tone">Tom da mensagem</label><select class="field-control select-control" id="tone"><option>Próximo e acolhedor</option><option>Direto e objetivo</option><option>Elegante e profissional</option><option>Descontraído</option></select></div>${field('Informações que devem aparecer (opcional)','details','Preço, prazo, condição especial...','textarea')}`;
      else if(category.id==='instagram'||category.id==='tiktok')fields=`${field(category.id==='instagram'?'Produto, serviço ou assunto':'Produto ou assunto do vídeo','subject',category.id==='instagram'?'Ex.: novidades de outono na loja':'Ex.: 3 formas de usar uma camisa branca','text',true)}${category.id==='instagram'?field('Formato do conteúdo','format','Ex.: post, reels, story, carrossel'):field('Duração ou formato do vídeo','format','Ex.: 30 segundos, mostrando o produto')}${field('Detalhes extras (opcional)','details','Público, estilo, benefício ou chamada para ação...','textarea')}`;
      else fields=`${field(category.id==='anuncios'?'Produto ou objetivo da campanha':'O que você quer criar?','subject','Conte um pouco sobre sua ideia...','text',true)}${field('Informações adicionais (opcional)','details','Público, estilo, prazo, oferta ou referências...','textarea')}`;
      const isImage=category.id==='imagens';
      return `<a href="#" class="crumb" data-nav="${category.id}">← ${category.name}</a><section class="card form-card"><h1>${esc(state.solution[0])}</h1><div class="quote">“${esc(state.solution[1])}”</div><div class="form-note">${store?`Conteúdo personalizado para ${esc(store.name)}.`:'Sem loja selecionada: o conteúdo sai genérico. Cadastre sua loja para resultados personalizados.'}</div><form id="generator-form">${fields}${isImage?`<div class="field"><label for="product-image">Foto do produto (opcional)</label><div class="file-box"><input id="product-image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small>PNG, JPG, WEBP ou GIF até 4 MB. Usada para descrever e melhorar a foto.</small></div></div>`:''}<div class="form-actions"><button class="btn btn-primary" type="submit">✨ Gerar agora</button><button class="btn" type="reset">Limpar</button></div></form></section>${state.result?renderResult():''}`
    }
    function renderResult(){return `<section class="card result-card"><div class="result-header"><h2>Conteúdo pronto para usar</h2><span class="category-count">Gerado agora</span></div><div class="result-content" id="result-content">${esc(state.result)}</div><div class="result-actions"><button class="btn btn-primary btn-small" data-action="copy">▢ Copiar conteúdo</button><button class="btn btn-small" data-action="save">Salvar no histórico</button></div></section>`}
    function renderHistory(){if(!state.history.length)return `<section class="card section-card"><h1>Histórico</h1><p>Os conteúdos que você salvar aparecem aqui neste dispositivo.</p><div class="empty">Ainda não há conteúdos salvos.</div></section>`;return `<section class="card section-card"><h1>Histórico</h1><p>Seus conteúdos salvos neste dispositivo.</p></section><div class="history-list">${state.history.map((item,index)=>`<article class="card history-item"><div><h3>${esc(item.title)}</h3><p>${esc(item.store||'Sem loja')} · ${new Date(item.date).toLocaleString('pt-BR')}</p></div><button class="btn btn-small" data-history="${index}">Abrir</button></article>`).join('')}</div>`}
    function renderStoreModal(){return `<div class="overlay" data-action="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="store-title"><div class="modal-header"><h2 id="store-title">Cadastrar loja</h2><button class="btn close-btn" data-action="close-modal" aria-label="Fechar">×</button></div><p class="modal-subtitle">Esses dados entram automaticamente em todos os conteúdos gerados.</p><form id="store-form"><div class="form-grid">${field('Nome da loja','store-name','Nome da sua loja','text',true)}${field('Nicho','store-niche','Ex.: moda feminina')}${field('Cidade','store-city','Sua cidade')}${field('Bairro','store-neighborhood','Seu bairro')}${field('Instagram','store-instagram','@sualoja')}${field('Endereço','store-address','Rua, número e complemento')}${field('Tom padrão da marca','store-tone','Ex.: próximo, alegre e acolhedor','text',false)}</div><div class="form-actions"><button type="button" class="btn" data-action="close-modal">Cancelar</button><button class="btn btn-primary" type="submit">Salvar loja</button></div></form></section></div>`}
    function bind(){
      document.querySelectorAll('[data-nav]').forEach(button=>button.addEventListener('click',event=>{event.preventDefault();navigate(button.dataset.nav)}));
      document.querySelectorAll('[data-category]').forEach(card=>card.addEventListener('click',()=>navigate(card.dataset.category)));
      document.querySelectorAll('[data-solution-title]').forEach(card=>card.addEventListener('click',()=>{state.category=card.dataset.solutionCategory;const category=currentCategory();state.solution=category.solutions.find(solution=>solution[0]===card.dataset.solutionTitle);state.page='form';state.result=null;state.mobileOpen=false;render();window.scrollTo(0,0)}));
      document.querySelectorAll('[data-action="new-store"]').forEach(button=>button.addEventListener('click',()=>{state.storeModal=true;render()}));
      document.querySelectorAll('[data-action="mobile"]').forEach(button=>button.addEventListener('click',()=>{state.mobileOpen=!state.mobileOpen;render()}));
      document.querySelectorAll('[data-action="close-mobile"]').forEach(button=>button.addEventListener('click',()=>{state.mobileOpen=false;render()}));
      document.querySelectorAll('[data-action="close-modal"]').forEach(button=>button.addEventListener('click',()=>{state.storeModal=false;render()}));
      document.querySelector('[data-action="overlay"]')?.addEventListener('click',event=>{if(event.target===event.currentTarget){state.storeModal=false;render()}});
      document.getElementById('store-select')?.addEventListener('change',event=>{state.selectedStore=event.target.value;persist();render()});
      document.getElementById('search')?.addEventListener('input',event=>{state.search=event.target.value;const cursor=event.target.selectionStart;render();const input=document.getElementById('search');input.focus();input.setSelectionRange(cursor,cursor)});
      document.getElementById('store-form')?.addEventListener('submit',event=>{event.preventDefault();const data=new FormData(event.currentTarget);const store={id:crypto.randomUUID(),name:data.get('store-name').trim(),niche:data.get('store-niche').trim(),city:data.get('store-city').trim(),neighborhood:data.get('store-neighborhood').trim(),instagram:data.get('store-instagram').trim(),address:data.get('store-address').trim(),tone:data.get('store-tone').trim()};if(!store.name)return;state.stores.push(store);state.selectedStore=store.id;state.storeModal=false;persist();render();toast('Loja cadastrada com sucesso.')});
      document.getElementById('generator-form')?.addEventListener('submit',event=>{event.preventDefault();const data=new FormData(event.currentTarget);const subject=String(data.get('subject')||'').trim();if(!subject){document.getElementById('subject')?.focus();return}state.result=generateContent(currentCategory(),state.solution,subject,String(data.get('details')||'').trim(),data);render()});
      document.querySelector('[data-action="copy"]')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(state.result);toast('Conteúdo copiado.')}catch{toast('Não foi possível copiar automaticamente.')}});
      document.querySelector('[data-action="save"]')?.addEventListener('click',()=>{state.history.unshift({title:state.solution[0],content:state.result,store:selectedStore()?.name||'',date:new Date().toISOString()});persist();toast('Conteúdo salvo no histórico.')});
      document.querySelectorAll('[data-history]').forEach(button=>button.addEventListener('click',()=>{const item=state.history[Number(button.dataset.history)];state.category=categories.find(category=>category.solutions.some(solution=>solution[0]===item.title))?.id;state.solution=currentCategory()?.solutions.find(solution=>solution[0]===item.title);state.result=item.content;state.page='form';render()}));
    }
    function generateContent(category,solution,subject,details,data){const store=selectedStore();const brand=store?.name||'sua loja';const city=store?.city?` em ${store.city}`:'';const tone=data.get('tone')||store?.tone||'próximo e acolhedor';const format=data.get('format')||'';const style=data.get('style')||'';const extra=details?`\n\nDetalhes considerados: ${details}`:'';const title=solution[0];
      if(category.id==='imagens')return `PROMPT PARA FOTO — ${subject}\n\nCrie uma imagem comercial de alta qualidade para ${brand}${city}, apresentando ${subject} com aparência realista, composição limpa e iluminação suave. Estilo: ${style||'fundo branco para catálogo'}. Preserve fielmente as características, cores e proporções do produto. Enquadramento profissional, foco nítido, acabamento natural e espaço visual equilibrado. Não invente textos, marcas ou detalhes no produto.${extra}`;
      if(category.id==='atendimento')return `Mensagem para WhatsApp — ${title}\n\nOi! Tudo bem? 😊 Aqui é da ${brand}. Vi sua mensagem sobre ${subject.toLowerCase()} e queria te ajudar a encontrar a melhor opção. Posso te passar todos os detalhes e tirar qualquer dúvida por aqui.\n\nSe fizer sentido para você, me chama que te ajudo com carinho!${extra}\n\nTom: ${tone}`;
      if(category.id==='instagram')return `✨ ${subject} ✨\n\nTem novidade boa passando por aqui! Na ${brand}, a gente escolhe cada detalhe pensando em você. Conta pra gente: qual é o seu favorito?\n\nSalve este post para ver depois e envie para alguém que vai amar. 💛\n\n#${slug(store?.niche||'lojapertodevo')} #${slug(subject.split(' ')[0])} #${slug(store?.city||'compralocal')} #novidades #feitoComCarinho${format?`\n\nFormato sugerido: ${format}`:''}${extra}`;
      if(category.id==='tiktok')return `ROTEIRO DE VÍDEO — ${subject}\n\nGANCHO (0–3s): “Você também estava procurando ${subject.toLowerCase()}?”\n\nCENA 1: Mostre o produto ou a situação de perto. Texto na tela: “Olha só essa novidade!”\n\nCENA 2: Apresente o principal benefício em uma frase curta. Mostre um detalhe que faz diferença.\n\nCENA 3: Mostre como usar ou o resultado final.\n\nFECHAMENTO: “Gostou? Encontre na ${brand} e conta pra gente o que achou!”\n\nLEGENDA: Uma novidade feita para facilitar seu dia. 💛 #lojapertodevo #dicas #${slug(store?.niche||'compralocal')}${format?`\n\nFormato: ${format}`:''}${extra}`;
      if(category.id==='anuncios')return `ANÚNCIO — ${title}\n\nTEXTO PRINCIPAL\nConheça ${subject}: uma novidade da ${brand} que combina qualidade, cuidado e aquele detalhe que faz diferença. Aproveite para descobrir tudo de perto.\n\nTÍTULO\nUma novidade especial para você\n\nDESCRIÇÃO\nFale com a ${brand} e saiba mais. Atendimento próximo e sem complicação.\n\nCHAMADA PARA AÇÃO\nEnviar mensagem\n\nPÚBLICO INICIAL\nPessoas da região${city}, interessadas em ${store?.niche||'produtos e novidades locais'}. Teste o criativo com um orçamento pequeno e acompanhe mensagens, cliques e conversões.${extra}`;
      if(category.id==='canva')return `GUIA PARA CANVA — ${title}\n\n1. Abra o Canva e escolha um modelo de post para Instagram.\n2. Use uma foto clara de ${subject} como elemento principal.\n3. Mantenha uma paleta simples: amarelo quente, fundo escuro e bastante espaço livre.\n4. Adicione o nome ${brand} em tamanho legível.\n5. Revise o texto e exporte em PNG para publicação.\n\nTEXTO SUGERIDO PARA A ARTE\n${subject} chegou na ${brand}!\nVenha conferir. 💛${extra}`;
      if(category.id==='capcut')return `PLANO DE EDIÇÃO — ${title}\n\n1. Importe os clipes e escolha os melhores trechos sobre ${subject}.\n2. Corte pausas longas; abra com o momento mais interessante nos primeiros 2 segundos.\n3. Use cortes simples e mantenha o assunto sempre visível.\n4. Gere legendas automáticas e revise nomes e pontuação.\n5. Inclua uma chamada final: “Conheça na ${brand}”.\n6. Exporte em 1080p, formato vertical 9:16.${extra}`;
      return `IDEIA PARA A LOJA — ${title}\n\nUse ${subject} para criar uma comunicação clara e acolhedora para a ${brand}. Compartilhe a informação nos canais da loja e convide seus clientes para conversar.\n\nSugestão de mensagem:\n“Oi! Passando para contar uma novidade da ${brand}: ${subject}. Se quiser saber mais, estamos por aqui para ajudar. 💛”${extra}`;
    }
    function slug(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,25)||'loja'}
    function navigate(page){if(page==='new-store'){state.storeModal=true}else if(categories.some(category=>category.id===page)){state.page='category';state.category=page;state.solution=null;state.result=null}else if(page==='history'){state.page='history';state.category=null;state.result=null}else{state.page='home';state.category=null;state.solution=null;state.result=null}state.mobileOpen=false;render();window.scrollTo(0,0)}
    let toastTimer;function toast(message){document.querySelector('.toast')?.remove();const node=document.createElement('div');node.className='toast';node.textContent=message;document.body.append(node);clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.remove(),2600)}
    render();
  </script>
</body>
</html>
